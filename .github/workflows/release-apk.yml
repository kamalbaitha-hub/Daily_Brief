name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger whenever a tag like v1.1, v1.2, v2.0 is pushed
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Rename APK with Tag or Run Number
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v1.0.${{ github.run_number }}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DailyBrief-${VERSION}.apk
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Daily Brief ${{ env.RELEASE_TAG }}
          body: |
            ## Daily Brief ${{ env.RELEASE_TAG }}
            Automated build with executive AI news summaries and offline caching.
            
            ### What's New:
            - Updated news feeds & AI summarization
            - Performance enhancements and bug fixes
            
            Download `DailyBrief-${{ env.RELEASE_TAG }}.apk` below or let your installed app update automatically.
          files: app/build/outputs/apk/debug/DailyBrief-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
